spring.application.name=done-yet

# Database Configuration (Fly.io Postgres - set via SPRING_DATASOURCE_URL env var)
# Default: localhost (for local dev only, will be overridden by env var in production)
spring.datasource.url=jdbc:postgresql://localhost:5432/done_yet
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
