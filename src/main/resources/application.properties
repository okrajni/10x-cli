spring.application.name=done-yet

# Database Configuration
# NOTE: Spring Boot needs a JDBC URL (jdbc:postgresql://...). Fly.io's DATABASE_URL
# uses the postgresql://user:pass@host/db form, which Spring will NOT parse.
# In deployed environments set SPRING_DATASOURCE_URL (with the jdbc: prefix)
# plus SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD instead.
spring.datasource.url=jdbc:postgresql://localhost:5432/done_yet
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production}

# Email Service Configuration
app.email.enabled=true
app.email.sender=noreply@doneyet.local
app.email.provider=mock

# Google Generative AI Configuration
# Set GOOGLE_API_KEY environment variable for AI task suggestions
# This is used by the /api/suggestions endpoint for Gemini-powered task generation
