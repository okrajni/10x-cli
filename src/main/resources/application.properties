spring.application.name=done-yet

# Database Configuration (Fly.io Postgres via DATABASE_URL)
# Fly.io sets DATABASE_URL in format: postgresql://user:pass@host/db
# Spring Boot auto-configures datasource from DATABASE_URL or SPRING_DATASOURCE_URL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/done_yet}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production}
