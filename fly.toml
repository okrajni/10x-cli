# fly.toml app configuration file generated for doneyet on 2026-08-25T15:57:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'doneyet'
primary_region = 'sjc'

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
JAVA_OPTS = "-XX:+UseContainerSupport"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
